services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mealsync
      POSTGRES_PASSWORD: mealsync
      POSTGRES_DB: mealsync
    ports:
      - "5432:5432"
    volumes:
      - mealsync_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealsync -d mealsync"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mealsync_pg:
